name: Server CI

# Build + test the server on PRs touching server code or Docker.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "ops/docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/server-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/Server/ClashUp.Server.sln

      - name: Build
        run: dotnet build src/Server/ClashUp.Server.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/Server/ClashUp.Server.sln -c Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify all three images build (no push).
      - name: Build services image
        run: docker build -f ops/docker/services.Dockerfile -t clashup-services:ci .

      - name: Build gameserver image
        run: docker build -f ops/docker/gameserver.Dockerfile -t clashup-gameserver:ci .

      - name: Build gateway image
        run: docker build -f ops/docker/gateway.Dockerfile -t clashup-gateway:ci .
