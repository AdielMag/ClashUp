      <rect x="72" width="62" height="22" rx="6" fill="#222c38" stroke="#2d3744"/>
      <text x="84" y="15" class="mono txt" font-size="11">1.0.1</text><text x="122" y="15" class="mut" font-size="12">✕</text>
    </g>
