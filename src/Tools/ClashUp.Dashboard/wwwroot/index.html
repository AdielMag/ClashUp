<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClashUp Fleet Dashboard</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a212b; --panel2: #222c38;
      --text: #e6edf3; --muted: #8b98a5; --accent: #4da3ff;
      --good: #3fb950; --warn: #d29922; --bad: #f85149; --border: #2d3744;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px;
             border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; margin: 0; }
    header .meta { color: var(--muted); font-size: 13px; }
    .wrap { padding: 24px; display: grid; gap: 24px; max-width: 1200px; margin: 0 auto; }
    .tier h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em;
               color: var(--accent); margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .card .name { font-weight: 600; font-size: 14px; }
    .card .id { color: var(--muted); font-size: 11px; margin-bottom: 10px; word-break: break-all; }
    .state { font-size: 11px; padding: 2px 8px; border-radius: 999px; float: right; }
    .state.RUNNING { background: rgba(63,185,80,.15); color: var(--good); }
    .state.OTHER { background: rgba(210,153,34,.15); color: var(--warn); }
    .bars { display: grid; gap: 8px; margin: 10px 0; }
    .bar-row { display: grid; grid-template-columns: 40px 1fr 48px; align-items: center; gap: 8px; font-size: 12px; }
    .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .bar > span.hi { background: var(--bad); }
    .bar > span.mid { background: var(--warn); }
    .versions { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .vrow { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
    .vrow .tag { font-family: ui-monospace, monospace; color: var(--accent); }
    .vnote { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
             padding: 0 5px; margin-left: 6px; cursor: help; }
    .pill { font-family: ui-monospace, monospace; font-size: 11px; background: var(--panel2);
            border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin: 0 4px 4px 0;
            display: inline-flex; align-items: center; gap: 6px; }
    .pill button { background: none; border: none; color: var(--muted); cursor: pointer;
                   font-size: 13px; line-height: 1; padding: 0; }
    .pill button:hover:not(:disabled) { color: var(--bad); }
    .pill button:disabled { opacity: .25; cursor: not-allowed; }
    .empty { color: var(--muted); font-size: 13px; }
    .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .errors { background: rgba(248,81,73,.1); border: 1px solid var(--bad); color: #ffb3ae;
              border-radius: 8px; padding: 10px 14px; font-size: 13px; }
    .errors ul { margin: 6px 0 0; padding-left: 18px; }
    .sleep { display: flex; align-items: center; gap: 16px; background: rgba(210,153,34,.1);
             border: 1px solid var(--warn); border-radius: 10px; padding: 16px 20px; }
    .sleep .icon { font-size: 28px; }
    .sleep .txt { flex: 1; }
    .sleep .txt strong { color: var(--warn); font-size: 15px; }
    .sleep .txt div { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .wake-btn { background: var(--good); color: #06210d; border: none; border-radius: 8px;
                padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .wake-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .wake-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>ClashUp Fleet</h1>
    <span class="meta" id="meta">connecting…</span>
    <span class="meta" id="countdown" style="margin-left:auto"></span>
  </header>
  <div class="wrap" id="root"></div>

  <script>
    const fmtPct = v => (v == null ? "—" : v.toFixed(0) + "%");
    const barClass = v => v == null ? "" : v >= 85 ? "hi" : v >= 70 ? "mid" : "";

    function bar(label, value) {
      const pct = value == null ? 0 : Math.min(100, value);
      return `<div class="bar-row"><span>${label}</span>
        <div class="bar"><span class="${barClass(value)}" style="width:${pct}%"></span></div>
        <span>${fmtPct(value)}</span></div>`;
    }

    // A running backend's version. A clean semver (1.0.1) is a real client
    // release; anything else (e.g. 0.0.0-dev) is the dev build the gateway serves
    // to header-less server-to-server traffic via its default 'latest' tag.
    function versionRow(v) {
      const isRelease = /^\d+\.\d+\.\d+$/.test(v.version);
      const note = isRelease ? "" :
        `<span class="vnote" title="Not a client release. This backend serves header-less server-to-server traffic (e.g. GameServer→Services registration), which the gateway routes to its default 'latest' tag. It idle-evicts when unused.">internal · default route</span>`;
      return `<div class="vrow"><span><span class="tag">${v.version}</span>${note}</span><span>${v.ccu} CCU</span></div>`;
    }

    function instanceCard(inst) {
      const stateClass = inst.state === "RUNNING" ? "RUNNING" : "OTHER";
      const versions = (inst.versions || []).length
        ? inst.versions.map(versionRow).join("")
        : `<div class="empty">no active backends</div>`;
      return `<div class="card">
        <span class="state ${stateClass}">${inst.state}</span>
        <div class="name">${inst.name || "(pending)"}</div>
        <div class="id">${inst.id || ""}</div>
        <div class="bars">${bar("CPU", inst.cpuPercent)}${bar("RAM", inst.ramPercent)}</div>
        <div class="versions">${versions}</div>
      </div>`;
    }

    function tierBlock(tier) {
      const cards = tier.instances.length
        ? `<div class="grid">${tier.instances.map(instanceCard).join("")}</div>`
        : `<div class="empty">no instances</div>`;
      return `<section class="tier"><h2>${tier.tier} — ${tier.instances.length} instance(s)</h2>${cards}</section>`;
    }

    function tagPill(image, tag) {
      // 'latest' backs header-less routing — not deletable from here.
      const deletable = tag.toLowerCase() !== "latest";
      const btn = deletable
        ? `<button title="Remove ${image}:${tag} from registry"
             onclick="deleteTag('${image}','${tag}')">✕</button>`
        : `<button disabled title="'latest' can't be deleted">✕</button>`;
      return `<span class="pill">${tag}${btn}</span>`;
    }

    function imagesBlock(images) {
      const cards = images.length
        ? images.map(img => `<div class="card"><div class="name">${img.image}</div>
            <div style="margin-top:8px">${img.tags.filter(t => t.toLowerCase() !== "latest").map(t => tagPill(img.image, t)).join("")}</div></div>`).join("")
        : `<div class="empty">no images found</div>`;
      return `<section class="tier"><h2>Available versions (registry)</h2><div class="images">${cards}</div></section>`;
    }

    async function deleteTag(image, tag) {
      if (!confirm(`Permanently remove ${image}:${tag} from the registry?\n\nThis cannot be undone. Old clients on this version will no longer be able to connect.`)) {
        return;
      }
      try {
        const res = await fetch("/api/registry/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image, tag }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert("Delete failed: " + (data.error || res.statusText));
          return;
        }
        refresh();
      } catch (e) {
        alert("Delete failed: " + e.message);
      }
    }

    function sleepBlock(asleep) {
      if (!asleep) return "";
      const btn = waking
        ? `<button class="wake-btn" id="wakeBtn" disabled>waking… (~2-4 min cold start)</button>`
        : `<button class="wake-btn" id="wakeBtn" onclick="wake()">Wake fleet</button>`;
      return `<div class="sleep">
        <span class="icon">💤</span>
        <div class="txt">
          <strong>FLEET ASLEEP</strong>
          <div>Both tiers scaled to 0 to save cost. Players can't connect until you wake it.</div>
        </div>
        ${btn}
      </div>`;
    }

    let waking = false;
    async function wake() {
      const btn = document.getElementById("wakeBtn");
      if (btn) { btn.disabled = true; btn.textContent = "waking… (~2-4 min cold start)"; }
      waking = true;
      try {
        const res = await fetch("/api/wake", { method: "POST" });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert("Wake failed: " + (data.error || res.statusText));
          waking = false;
          refresh();
        }
        // On success leave the button in its "waking…" state; the next refresh that
        // sees instances back will clear the banner on its own.
      } catch (e) {
        alert("Wake failed: " + e.message);
        waking = false;
        refresh();
      }
    }

    function errorsBlock(errors) {
      if (!errors || !errors.length) return "";
      return `<div class="errors"><strong>Some data could not be loaded:</strong>
        <ul>${errors.map(e => `<li>${e}</li>`).join("")}</ul></div>`;
    }

    const REFRESH_MS = 5000;
    let nextRefreshAt = 0;

    async function refresh() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        document.getElementById("meta").textContent =
          "updated " + new Date(data.generatedAt).toLocaleTimeString();
        // Once instances are back, clear the waking latch so the banner disappears.
        if (!data.asleep) waking = false;
        document.getElementById("root").innerHTML =
          errorsBlock(data.errors) +
          sleepBlock(data.asleep) +
          data.tiers.map(tierBlock).join("") +
          imagesBlock(data.availableImages);
      } catch (e) {
        document.getElementById("meta").textContent = "error: " + e.message;
      } finally {
        nextRefreshAt = Date.now() + REFRESH_MS;
      }
    }

    // Live countdown so it's obvious the view auto-refreshes (and when).
    setInterval(() => {
      const secs = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
      document.getElementById("countdown").textContent =
        `auto-refresh every ${REFRESH_MS / 1000}s · next in ${secs}s`;
    }, 250);

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
